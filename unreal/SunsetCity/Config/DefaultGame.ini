[/Script/UnrealEd.ProjectPackagingSettings]
; The game loads its materials, people, cars and the sky's clouds by name while it runs, and nothing in the map refers to them, so the packaged game only
; has them if they are named here (without this, every surface fell back to Unreal's grey checkerboard).
+DirectoriesToAlwaysCook=(Path="/Game/SunsetCity")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineDebugMaterials")
