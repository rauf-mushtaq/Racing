; Sunset City: engine settings. Windows, DirectX 12 (Shader Model 6), Lumen (global illumination and reflections, hardware ray tracing when the card has it),
; virtual shadow maps, sky atmosphere with volumetric clouds and fog, no baked lighting (the city is built at run time, so everything is dynamic).

