name: web-tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'sw.js', 'precache.json', 'tests/**', 'package.json', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['src/**', 'index.html', 'sw.js', 'precache.json', 'tests/**', 'package.json']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
